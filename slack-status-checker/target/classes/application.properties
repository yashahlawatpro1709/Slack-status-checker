# Server configuration
quarkus.http.port=8080
quarkus.scheduler.enabled=true

# CORS and WebSocket configuration
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:3001,http://localhost:3002
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,Sec-WebSocket-Protocol,Sec-WebSocket-Version,Sec-WebSocket-Key,Sec-WebSocket-Accept,*
quarkus.http.cors.exposed-headers=*

# WebSocket specific configuration
quarkus.websocket.dispatch-to-worker=true
quarkus.websocket.max-frame-size=65536
quarkus.websocket.max-text-message-buffer-size=32768

# Debug logging
quarkus.log.category."io.quarkus.websocket".level=DEBUG
quarkus.log.category."org.jboss.websockets".level=DEBUG
quarkus.log.category."io.quarkus.vertx.http".level=DEBUG